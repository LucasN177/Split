name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Supabase secrets
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
          echo "::error::Die Repository-Secrets SUPABASE_URL und SUPABASE_KEY müssen gesetzt sein."
          exit 1
        fi

    # Secrets werden über Umgebungsvariablen an jq übergeben (kein Einbetten in das Skript)
    - name: Inject secrets in appsettings.json
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # Optional: ohne dieses Secret sind Push-Benachrichtigungen deaktiviert
        VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      run: |
        jq --arg url "$SUPABASE_URL" --arg key "$SUPABASE_KEY" --arg vapid "$VAPID_PUBLIC_KEY" \
          '.Supabase.Url = $url | .Supabase.AnonKey = $key | .Push.VapidPublicKey = $vapid' \
          wwwroot/appsettings.json > tmp.json && mv tmp.json wwwroot/appsettings.json
        # Entwicklungskonfiguration nicht mit ausliefern
        rm -f wwwroot/appsettings.Development.json

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test tests/Split.Tests -c Release

    - name: Publish
      run: dotnet publish Split.csproj -c Release -o release

    - name: Update base href
      run: sed -i 's/<base href="\/" \/>/<base href="\/Split\/" \/>/' release/wwwroot/index.html

    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Disable Jekyll
      run: touch release/wwwroot/.nojekyll

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: release/wwwroot

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write      # für Pages-Deploy
      id-token: write   # für OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
